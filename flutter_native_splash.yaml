# The native splash is the page's color (#0B0B0D) with the **PickMe mark** (the
# amber card over the fan of two cards) in the middle — the same mark the in-app
# splash (`lib/app/splash_screen.dart`) then draws at the same spot, so nothing
# flashes or jumps between the two (docs/SCREENS.md A1, docs/DECISIONS.md).
# Masters: `assets/icon/splash_glyph.png` (iOS and Android 11 and older) and
# `assets/icon/splash_android12.png` (1152 px, the artwork inside the central
# circle Android 12+ keeps: that system splash masks the icon to a circle of 2/3
# of its width).
#
# Generated via `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "0B0B0D"
  image: assets/icon/splash_glyph.png

  android_12:
    color: "0B0B0D"
    image: assets/icon/splash_android12.png

  android: true
  ios: true
  web: false
